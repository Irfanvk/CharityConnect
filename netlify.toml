[build]
  command = "npm run build"
  publish = "dist"

# ── Production environment variables ─────────────────────────────────────────
# Set VITE_CHARITY_APP_BASE_URL in Netlify dashboard:
#   Site configuration → Environment variables → Add variable
#   Key:   VITE_CHARITY_APP_BASE_URL
#   Value: https://api.poyyathabailgcc.com   ← your KVM1 backend URL
#
# Set VITE_WEB_PUSH_PUBLIC_KEY to the same VAPID public key configured on the KVM backend.
# Both values are safe to expose publicly (they are not secrets).
# ─────────────────────────────────────────────────────────────────────────────

# Force HTTP → HTTPS upgrade
[[redirects]]
  from = "http://poyyathabailgcc.com/*"
  to = "https://poyyathabailgcc.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.poyyathabailgcc.com/*"
  to = "https://poyyathabailgcc.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Caching ──────────────────────────────────────────────────────────────────
# Netlify applies every matching rule and the LAST one wins for the same header,
# so each file appears once and no catch-all "*.js" rule is used: a catch-all
# would also cover sw.js / push-sw.js and keep phones on an old version.

[[headers]]
  for = "/*"
    [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Built files carry a content hash in their name: safe to cache forever.
[[headers]]
  for = "/assets/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Files that decide which version a phone runs: always re-check.
[[headers]]
  for = "/index.html"
    [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
    [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/workbox-*.js"
    [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
    [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Push notification handler (imported by sw.js) - never cached, may control "/".
[[headers]]
  for = "/push-sw.js"
    [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
