[build]
  command = "npm run build"
  publish = "dist"

# ── Production environment variables ─────────────────────────────────────────
# Set VITE_CHARITY_APP_BASE_URL in Netlify dashboard:
#   Site configuration → Environment variables → Add variable
#   Key:   VITE_CHARITY_APP_BASE_URL
#   Value: https://api.poyyathabailgcc.com   ← your KVM1 backend URL
#
# Set VITE_WEB_PUSH_PUBLIC_KEY to the same VAPID public key configured on Render.
# Both values are safe to expose publicly (they are not secrets).
# ─────────────────────────────────────────────────────────────────────────────

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Force HTTP → HTTPS upgrade
[[redirects]]
  from = "http://poyyathabailgcc.com/*"
  to = "https://poyyathabailgcc.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.poyyathabailgcc.com/*"
  to = "https://poyyathabailgcc.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
    [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/manifest.json"
    [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
    [headers.values]
    Cache-Control = "no-cache"

# Push notification service worker — must never be cached and must be
# allowed to control the entire origin scope ("/").
[[headers]]
  for = "/push-sw.js"
    [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*.js"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
